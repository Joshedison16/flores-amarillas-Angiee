<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flores amarillas</title>
<style>
:root{--bg:#fff7dc;--bg2:#ffe7a0;--ink:#4a3410;--card:rgba(255,255,255,.72);--btn:#e6a700;--btnink:#3a2a08;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a12;--bg2:#2e2610;--ink:#fbeec0;--card:rgba(255,255,255,.08)}}
:root[data-theme="dark"]{--bg:#1c1a12;--bg2:#2e2610;--ink:#fbeec0;--card:rgba(255,255,255,.08)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}
main{display:flex;flex-direction:column;align-items:center;padding:16px 16px 28px;max-width:480px;margin:0 auto}
h1{font-family:'Segoe Script','Brush Script MT',cursive;font-weight:400;font-size:2rem;margin:8px 0 0;text-align:center;line-height:1.2}
#sub{margin:0 0 8px;font-style:italic;text-align:center;opacity:0;animation:fade 1s 2.5s forwards}
svg{width:100%;max-width:340px;height:auto;overflow:visible}
.stem{fill:none;stroke:#3f8f3a;stroke-width:6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:grow 1.8s ease-out forwards;animation-delay:var(--d,0s)}
@keyframes grow{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes fade{to{opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.petal,.core,.leaf{transform:scale(0);animation:pop .7s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:var(--d)}
.wrap{opacity:0;animation:fade .8s .3s forwards}
.sway{transform-origin:150px 410px;animation:sway 5s ease-in-out 4.5s infinite}
#msg{margin-top:6px;min-height:4.5rem;width:100%;max-width:340px;box-sizing:border-box;padding:14px 18px;border-radius:18px;background:var(--card);text-align:center;font-size:1.15rem;line-height:1.45;display:flex;align-items:center;justify-content:center}
nav{display:none;gap:10px;margin-top:18px}
button{font:inherit;border:0;border-radius:999px;padding:10px 18px;background:var(--card);color:var(--ink);cursor:pointer}
button.on{background:var(--btn);color:var(--btnink);font-weight:bold}
.fl{cursor:pointer}
.fall{position:fixed;top:-30px;width:12px;height:18px;background:#ffd23f;border-radius:50% 0 50% 0;opacity:.7;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div id="stage"></div>
  
  <div id="msg"></div>
  <nav>
    <button id="b1" class="on">🌻 Girasol</button>
    <button id="b2">💐 Ramo</button>
  </nav>
</main>
<script>
var q = new URLSearchParams(location.search);
var PARA = (q.get('para') || '').slice(0, 40);
var MSG = (q.get('msg') || 'Angieee No te quedarás sin tus flores amarillas, estas nunca se marchitarán 😂🌻').slice(0, 200);


function flower(cx, cy, s, d, step, idx) {
  var n = 16, o = '<g class="fl" data-i="' + idx + '">';
  for (var ring = 0; ring < 2; ring++) {
    for (var i = 0; i < n; i++) {
      var a = i * 360 / n + ring * 180 / n;
      var ry = (ring ? 26 : 34) * s, rx = (ring ? 10 : 12) * s;
      var oy = (ring ? 40 : 50) * s;
      var dl = (d + (ring * n + i) * step).toFixed(2);
      o += '<g transform="rotate(' + a + ' ' + cx + ' ' + cy + ')"><ellipse class="petal" cx="' + cx + '" cy="' + (cy - oy) + '" rx="' + rx + '" ry="' + ry + '" fill="' + (ring ? '#ffd23f' : '#f6b800') + '" style="transform-origin:' + cx + 'px ' + cy + 'px;--d:' + dl + 's"/></g>';
    }
  }
  o += '<g class="core" style="transform-origin:' + cx + 'px ' + cy + 'px;--d:' + (d + 2 * n * step + .1).toFixed(2) + 's"><circle cx="' + cx + '" cy="' + cy + '" r="' + 26 * s + '" fill="#6b4423"/>';
  for (var k = 1; k < 40; k++) {
    var r = Math.sqrt(k) * 3.9 * s, t = k * 137.5 * Math.PI / 180;
    o += '<circle cx="' + (cx + r * Math.cos(t)).toFixed(1) + '" cy="' + (cy + r * Math.sin(t)).toFixed(1) + '" r="' + 1.8 * s + '" fill="#3d2410"/>';
  }
  return o + '</g></g>';
}

function leaf(x, y, rot, d) {
  return '<g transform="rotate(' + rot + ' ' + x + ' ' + y + ')"><ellipse class="leaf" cx="' + x + '" cy="' + y + '" rx="34" ry="13" fill="#4caf50" style="transform-origin:' + x + 'px ' + y + 'px;--d:' + d + 's"/></g>';
}

function tulip(cx, cy, s, d, idx) {
  var P = function (x, y) { return (cx + x * s).toFixed(1) + ' ' + (cy + y * s).toFixed(1); };
  var C = function () { return Array.prototype.map.call(arguments, function (a) { return P(a[0], a[1]); }).join(', '); };
  var org = 'transform-origin:' + cx + 'px ' + (cy + 28 * s) + 'px;';
  var pet = function (dd, path, fill) { return '<path class="petal" d="' + path + '" fill="' + fill + '" stroke="#e0a800" stroke-width="1" style="' + org + '--d:' + dd + 's"/>'; };
  return '<g class="fl" data-i="' + idx + '">' +
    pet(d, 'M' + P(0, 28) + ' C' + C([-22, 24], [-24, -4], [-19, -28]) + ' C' + C([-12, -18], [-6, -12], [0, -6]) + ' Z', '#ffc928') +
    pet(d + .15, 'M' + P(0, 28) + ' C' + C([22, 24], [24, -4], [19, -28]) + ' C' + C([12, -18], [6, -12], [0, -6]) + ' Z', '#ffc928') +
    pet(d + .3, 'M' + P(0, 28) + ' C' + C([-14, 20], [-12, -8], [0, -32]) + ' C' + C([12, -8], [14, 20], [0, 28]) + ' Z', '#ffe066') + '</g>';
}

function filler(cx, cy, d) {
  var o = '';
  [[0, 0], [-7, 5], [7, 5], [-4, -7], [5, -6], [0, 11]].forEach(function (t, i) {
    var x = cx + t[0], y = cy + t[1];
    o += '<circle class="petal" cx="' + x + '" cy="' + y + '" r="5.5" fill="#ffd93b" style="transform-origin:' + x + 'px ' + y + 'px;--d:' + (d + i * .05).toFixed(2) + 's"/>';
  });
  return o;
}

function sunflower() {
  return '<svg viewBox="0 0 300 420"><g class="sway">' +
    '<path class="stem" pathLength="1" d="M150 410 C 164 330, 138 260, 150 180"/>' +
    '<path class="stem" pathLength="1" style="--d:.3s" d="M150 410 Q 80 390 60 318"/>' +
    '<path class="stem" pathLength="1" style="--d:.5s" d="M150 410 Q 220 360 240 283"/>' +
    leaf(122, 310, -30, 1.2) + leaf(180, 265, 30, 1.5) +
    tulip(60, 290, 1, 1.4, 0) + tulip(240, 255, 1, 1.6, 0) +
    flower(150, 150, 1, 1.9, .05, 0) + '</g></svg>';
}

function bouquet() {
  var P = [[150, 62, .8, 1], [52, 140, .8, 1], [248, 140, .8, 1], [98, 95, .5, 0], [202, 95, .5, 0], [150, 120, .62, 0], [78, 190, .45, 0], [222, 190, .45, 0], [118, 200, .8, 1], [182, 200, .8, 1], [150, 225, .4, 0]];
  var stems = '', flowers = '';
  [[105, 48], [195, 48], [40, 95], [260, 95], [30, 185], [270, 185], [60, 235], [240, 235]].forEach(function (f, j) {
    stems += '<path class="stem" pathLength="1" style="--d:' + (j * .08) + 's;stroke-width:3" d="M150 350 Q ' + ((f[0] + 150) / 2) + ' 270 ' + f[0] + ' ' + (f[1] + 14) + '"/>';
    flowers += filler(f[0], f[1], 4 + j * .12);
  });
  P.forEach(function (p, k) {
    var ey = p[3] ? p[1] + 28 * p[2] : p[1];
    stems += '<path class="stem" pathLength="1" style="--d:' + (k * .08) + 's" d="M150 350 Q ' + ((p[0] + 150) / 2) + ' 260 ' + p[0] + ' ' + ey + '"/>';
    flowers += p[3] ? tulip(p[0], p[1], p[2], 1.6 + k * .25, k) : flower(p[0], p[1], p[2], 1.6 + k * .25, .03, k);
  });
  var wrap = '<g class="wrap"><polygon points="80,290 220,290 150,405" fill="#d9b382" stroke="#b8905c" stroke-width="2"/>' +
    '<polygon points="80,290 150,405 118,290" fill="#e8c99a"/>' +
    '<g transform="rotate(-25 150 318)"><ellipse cx="128" cy="318" rx="22" ry="10" fill="#d94f7a"/></g>' +
    '<g transform="rotate(25 150 318)"><ellipse cx="172" cy="318" rx="22" ry="10" fill="#d94f7a"/></g>' +
    '<circle cx="150" cy="318" r="8" fill="#b83a63"/></g>';
  return '<svg id="bq" viewBox="0 0 300 420"><g class="sway">' + stems +
    leaf(112, 290, -35, .9) + leaf(188, 290, 35, 1.0) + leaf(128, 255, -50, 1.1) + leaf(172, 255, 50, 1.2) + leaf(85, 262, -28, 1.0) + leaf(215, 262, 28, 1.1) +
    wrap + flowers + '</g></svg>';
}

var msg = document.getElementById('msg'), timer, delay;
function type(text) {
  clearInterval(timer); msg.textContent = '';
  var ch = Array.from(text), i = 0;
  timer = setInterval(function () { msg.textContent += ch[i++]; if (i >= ch.length) clearInterval(timer); }, 45);
}

function show(n) {
  clearTimeout(delay); clearInterval(timer); msg.textContent = '';
  document.getElementById('b1').className = n === 1 ? 'on' : '';
  document.getElementById('b2').className = n === 2 ? 'on' : '';
  document.getElementById('stage').innerHTML = n === 1 ? sunflower() : bouquet();
  if (n === 1) {
    delay = setTimeout(function () { type(MSG); }, 4300);
  } else {
    delay = setTimeout(function () { type(MSG); }, 6300);
    document.getElementById('bq').addEventListener('click', function (e) {
      var f = e.target.closest('.fl');
      if (f) { clearTimeout(delay); type(FRASES[+f.dataset.i]); }
    });
  }
}

document.getElementById('title').textContent = (q.get('titulo') || (PARA ? 'Para ' + PARA : 'tus flores amarillas')).slice(0, 60);
document.getElementById('b1').onclick = function () { show(1); };
document.getElementById('b2').onclick = function () { show(2); };
for (var i = 0; i < 12; i++) {
  var s = document.createElement('span');
  s.className = 'fall';
  s.style.left = (Math.random() * 100) + '%';
  s.style.animationDuration = (9 + Math.random() * 8) + 's';
  s.style.animationDelay = (-Math.random() * 12) + 's';
  document.body.appendChild(s);
}
show(2);
</script>
</body>
</html>
